<!DOCTYPE html>
<html lang="en">
<head>
    <title>Login with Navigation</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
<link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" integrity="sha384-42kyIPf7HDYLkGffmxDhSx/3Z/53wGBs3nD6wEFxsbeDc7rMO6mkYbkAcpRsnMU2" crossorigin="anonymous">

</head>
<body>
    <header>
<h2 class="logo">Logo</h2>
<nav class="navigation">
    <a href="#">Home</a>
    <a href="#">About</a>
    <a href="#">Services</a>
    <a href="#">Contact</a>
    
    <button class="btnlogin-popup">Login</button>
</nav>
    </header>


    
<footer>
    <div class="wrapper">
        <form action="#" novalidate>
<h1>
    login
</h1>
<div class="input_box">
    <i class='bx bxl-gmail'></i>
<input type="text" id="user" placeholder="Username or E-mail" autocomplete="username" required>
<label>E-mail</label>
</div>
<div class="input_box">
    <i class='bx bxs-lock-alt' ></i>
    <input type="password" id="pass" placeholder="Password" autocomplete="current-password" required>
    <label>Password</label>

</div>
<div class="remember_forget">
    <label><input type="checkbox"> Remember me</label>

<a href="#">Forgotten Password?</a>
</div>
<p id="form-error" class="form-error" role="alert"></p>
<button value="1" type="submit" class="btn">Login</button>
<div class="register_link">
<p>Don't have an account? &nbsp; <a href="#">Register</a></p>
</div>
        </form>
    </div>
</footer>





    
<script>
document.querySelector("form").addEventListener("submit", function (e) {
    e.preventDefault();
    var user = document.getElementById("user").value.trim();
    var pass = document.getElementById("pass").value;
    var err = document.getElementById("form-error");
    var msg = "";
    if (!user) { msg = "Please enter your username or e-mail."; }
    
    else if (pass.length < 6) { msg = "Password must be at least 6 characters."; }
    err.textContent = msg;
    if (!msg) { err.style.color = "#9f9"; err.textContent = "Looks good (demo only, nothing was sent)."; }
    else { err.style.color = "#ff8080"; }
});
</script>
</body>
</html>
