<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simple Login Template - Login Templates</title>
  <meta name="description" content="A centred glass-style login template with register, forgot password, password strength meter and dark mode.">
  <meta name="theme-color" content="#0b1622">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Simple Login Template">
  <meta property="og:description" content="Glass-style auth flow: sign in, register, forgot password.">
  <meta property="og:image" content="../assets/img/design-simple.webp">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('lt.theme');
        if (!t) t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) { /* default theme */ }
    })();
  </script>
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/auth.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>

  <div class="scene" aria-hidden="true">
    <div class="scene-layer" data-parallax="0.15">
      <picture>
        <source type="image/avif" srcset="back-900.avif">
        <source type="image/webp" srcset="back-900.webp">
        <img src="back-900.jpg" width="900" height="514" alt="" fetchpriority="high">
      </picture>
    </div>
    <div class="scene-shade"></div>
    <div class="fly" style="width:90px;height:90px;left:12%;top:20%" data-depth="22"><span class="float"></span></div>
    <div class="fly" style="width:60px;height:60px;right:14%;top:30%" data-depth="-16"><span class="float slow"></span></div>
    <div class="fly" style="width:120px;height:120px;right:22%;bottom:12%" data-depth="12"><span class="float"></span></div>
  </div>

  <header class="topbar">
    <a class="back-link" href="../index.html">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
      <span>All templates</span>
    </a>
    <button type="button" class="icon-btn theme-toggle" data-theme-toggle aria-label="Switch theme" aria-pressed="true">
      <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </header>

  <main id="main" class="stage">
    <div class="auth-card" data-reveal>
      <div id="auth-root" data-variant="simple"><noscript><p class="sub">This demo needs JavaScript to run.</p></noscript></div>
    </div>
  </main>

  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/parallax.js"></script>
  <script src="../assets/js/auth-ui.js"></script>
</body>
</html>
